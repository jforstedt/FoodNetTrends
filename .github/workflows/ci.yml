name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint scripts and schema
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck on shell scripts
        run: |
          shellcheck --exclude=SC2086,SC2034 run_workflow.sh
          shellcheck --exclude=SC2086,SC2034 build_container.sh

      - name: Validate nextflow_schema.json is valid JSON
        run: python3 -c "import json; json.load(open('nextflow_schema.json'))"

  r-syntax:
    name: R syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Check R syntax in bin/ and dashboard/
        run: |
          failed=0
          for f in bin/*.R dashboard/*.R; do
            echo "Checking syntax: $f"
            if ! Rscript -e "parse('$f')"; then
              echo "::error::Syntax error in $f"
              failed=1
            fi
          done
          if [ "$failed" -eq 1 ]; then
            exit 1
          fi
          echo "All R files passed syntax check."

  nextflow-check:
    name: Nextflow config validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/

      - name: Validate config with test profile
        run: nextflow config -profile test

      - name: Validate help text renders
        run: nextflow run main.nf -profile test --help
