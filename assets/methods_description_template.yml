data: |
  <h4>Methods</h4>
  <p>Incidence rate trends were estimated using the cdcgov/foodnettrends pipeline v${workflow.manifest.version} ${doi_text}, which fits Bayesian penalized spline models to FoodNet surveillance data. Models were fitted using brms (<a href="https://doi.org/10.18637/jss.v080.i01">B&uuml;rkner, 2017</a>) with Stan as the backend sampling engine (<a href="https://doi.org/10.18637/jss.v076.i01">Carpenter <em>et al.</em>, 2017</a>). Software environments were managed using the Bioconda (<a href="https://doi.org/10.1038/s41592-018-0046-7">Gr&uuml;ning <em>et al.</em>, 2018</a>) and Biocontainers (<a href="https://doi.org/10.1093/bioinformatics/btx192">da Veiga Leprevost <em>et al.</em>, 2017</a>) projects.</p>
  <p>The pipeline was executed with Nextflow v${workflow.nextflow.version} (<a href="https://doi.org/10.1038/nbt.3820">Di Tommaso <em>et al.</em>, 2017</a>) with the following command:</p>
  <pre><code>${workflow.commandLine}</code></pre>
  <p>${tool_citations}</p>
